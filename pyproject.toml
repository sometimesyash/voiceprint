[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceprint"
version = "0.1.0"
description = "Measure how a person writes, then hold generated prose to it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yash Nairan" }]
keywords = ["stylometry", "idiolect", "authorship", "writing", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[project.scripts]
vp = "voiceprint.cli:main"
voiceprint = "voiceprint.cli:main"

[project.urls]
Homepage = "https://github.com/sometimesyash/voiceprint"

[tool.hatch.build.targets.wheel]
packages = ["voiceprint"]
